<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 26" width="1000" height="26" role="img" aria-label="divider">
  <defs>
    <linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#ff2d55" stop-opacity="0.45"/>
      <stop offset="82%"  stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes run  { 0% { transform: translateX(-40px) } 100% { transform: translateX(1040px) } }
      @keyframes puls { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
      .pkt  { animation: run 4.2s linear infinite; }
      .pkt2 { animation: run 4.2s linear infinite 1.4s; }
      .pkt3 { animation: run 4.2s linear infinite 2.8s; }
      .tick { animation: puls 2.6s ease-in-out infinite; }
    </style>
  </defs>
  <rect x="0" y="12" width="1000" height="1.4" fill="url(#dl)"/>
  <g fill="#67e8f9">
    <rect class="pkt"  x="0" y="9.5" width="22" height="6" rx="1" opacity="0.9"/>
    <rect class="pkt2" x="0" y="9.5" width="11" height="6" rx="1" opacity="0.6"/>
    <rect class="pkt3" x="0" y="9.5" width="30" height="6" rx="1" opacity="0.35"/>
  </g>
  <g fill="#22d3ee" class="tick">
    <rect x="120" y="8" width="1.2" height="9"/>
    <rect x="360" y="8" width="1.2" height="9"/>
    <rect x="640" y="8" width="1.2" height="9"/>
    <rect x="880" y="8" width="1.2" height="9"/>
  </g>
</svg>
