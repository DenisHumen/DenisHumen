<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="DenisHumen — Network, Security, Systems">
  <title>DenisHumen // connected to the Wired</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#05060a"/>
      <stop offset="55%" stop-color="#080b12"/>
      <stop offset="100%" stop-color="#0b0f18"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.55">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="60%"  stop-color="#22d3ee" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="55%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
    </radialGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#7dd3fc" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </linearGradient>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <rect width="4" height="1.4" y="0" fill="#000000" opacity="0.42"/>
    </pattern>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1a3a45" stroke-width="0.6" opacity="0.35"/>
    </pattern>

    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="n">
        <animate attributeName="seed" values="2;19;5;31;11;24;3" dur="0.9s" repeatCount="indefinite"/>
      </feTurbulence>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <clipPath id="sliceBand"><rect x="0" y="126" width="1200" height="18"/></clipPath>

    <style>
      .mono { font-family: "SFMono-Regular", "DejaVu Sans Mono", "Liberation Mono", Consolas, monospace; }

      @keyframes shiftR {
        0%,  6%   { transform: translate(0,0); }
        7%        { transform: translate(-5px, 1px); }
        8.5%      { transform: translate(3px, -1px); }
        10%, 42%  { transform: translate(0,0); }
        43%       { transform: translate(-7px, 0px); }
        44.5%     { transform: translate(2px, 2px); }
        46%, 77%  { transform: translate(0,0); }
        78%       { transform: translate(4px, -2px); }
        79.5%,100%{ transform: translate(0,0); }
      }
      @keyframes shiftC {
        0%,  6%   { transform: translate(0,0); }
        7%        { transform: translate(5px, -1px); }
        8.5%      { transform: translate(-3px, 1px); }
        10%, 42%  { transform: translate(0,0); }
        43%       { transform: translate(7px, 0px); }
        44.5%     { transform: translate(-2px, -2px); }
        46%, 77%  { transform: translate(0,0); }
        78%       { transform: translate(-4px, 2px); }
        79.5%,100%{ transform: translate(0,0); }
      }
      @keyframes slice {
        0%, 40%   { opacity: 0; transform: translate(0,0); }
        41%       { opacity: 1; transform: translate(-14px, 0); }
        43%       { opacity: 1; transform: translate(10px, 0); }
        44%, 76%  { opacity: 0; transform: translate(0,0); }
        77%       { opacity: 1; transform: translate(9px, 0); }
        78.5%     { opacity: 0; transform: translate(0,0); }
        100%      { opacity: 0; }
      }
      @keyframes blink   { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      @keyframes flicker { 0%,100% { opacity: .92 } 47% { opacity: .92 } 48% { opacity: .55 } 49% { opacity: .95 } 92% { opacity: .70 } 93% { opacity: .92 } }
      @keyframes drift   { 0% { transform: translateY(-70px) } 100% { transform: translateY(310px) } }
      @keyframes ping    { 0% { r: 26; opacity: .85 } 100% { r: 120; opacity: 0 } }
      @keyframes hum     { 0%,100% { opacity: .25 } 50% { opacity: .6 } }

      .gR    { animation: shiftR 7s steps(1,end) infinite; }
      .gC    { animation: shiftC 7s steps(1,end) infinite; }
      .slice { animation: slice 7s steps(1,end) infinite; }
      .cur   { animation: blink 1.05s steps(1,end) infinite; }
      .crt   { animation: flicker 5.5s ease-in-out infinite; }
      .sweep { animation: drift 6.5s linear infinite; }
      .p1    { animation: ping 3.6s ease-out infinite; }
      .p2    { animation: ping 3.6s ease-out infinite 1.2s; }
      .p3    { animation: ping 3.6s ease-out infinite 2.4s; }
      .hum   { animation: hum 3.2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- ── background ─────────────────────────────────────────── -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- ── the Wired: poles + sagging power lines ─────────────── -->
  <g stroke="#243040" fill="none" stroke-width="1.6" opacity="0.85">
    <path d="M0 78 Q 150 118 300 76"/>
    <path d="M300 76 Q 450 116 600 74"/>
    <path d="M600 74 Q 760 114 920 78"/>
    <path d="M920 78 Q 1060 116 1200 80"/>
    <path d="M0 96 Q 150 140 300 94" opacity="0.6"/>
    <path d="M300 94 Q 450 138 600 92" opacity="0.6"/>
    <path d="M600 92 Q 760 136 920 96" opacity="0.6"/>
    <path d="M920 96 Q 1060 138 1200 98" opacity="0.6"/>
  </g>

  <g fill="#141a24" stroke="#212a38" stroke-width="1">
    <g transform="translate(300,0)">
      <rect x="-3" y="46" width="6" height="254"/>
      <rect x="-34" y="60" width="68" height="4"/>
      <rect x="-26" y="80" width="52" height="3.5"/>
    </g>
    <g transform="translate(920,0)">
      <rect x="-3" y="50" width="6" height="250"/>
      <rect x="-30" y="64" width="60" height="4"/>
      <rect x="-22" y="84" width="44" height="3.5"/>
    </g>
    <g transform="translate(600,0)" opacity="0.55">
      <rect x="-2" y="56" width="4" height="244"/>
      <rect x="-20" y="68" width="40" height="3"/>
    </g>
  </g>

  <!-- ── right side: node / signal ping ─────────────────────── -->
  <g transform="translate(1046,148)">
    <circle r="120" fill="none" stroke="#22d3ee" stroke-width="0.8" opacity="0.10"/>
    <circle r="86"  fill="none" stroke="#22d3ee" stroke-width="0.8" opacity="0.14"/>
    <circle r="52"  fill="none" stroke="#22d3ee" stroke-width="0.9" opacity="0.20"/>
    <circle r="26" fill="none" stroke="#22d3ee" stroke-width="1.2">
      <animate attributeName="r" values="26;120" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="26" fill="none" stroke="#22d3ee" stroke-width="1.2">
      <animate attributeName="r" values="26;120" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="26" fill="none" stroke="#67e8f9" stroke-width="1.2">
      <animate attributeName="r" values="26;120" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#67e8f9"/>
    <circle r="14" fill="#22d3ee" opacity="0.18" filter="url(#soft)"/>
  </g>

  <!-- ── type ───────────────────────────────────────────────── -->
  <g class="crt">
    <text class="mono" x="60" y="86" fill="#22d3ee" font-size="17" letter-spacing="2.5" opacity="0.9">&#187; connecting to the wired<tspan class="cur">_</tspan></text>

    <g>
      <text class="mono gR" x="60" y="166" fill="#ff2d55" font-size="76" font-weight="bold" letter-spacing="2" opacity="0.75" style="mix-blend-mode:screen">DenisHumen</text>
      <text class="mono gC" x="60" y="166" fill="#22d3ee" font-size="76" font-weight="bold" letter-spacing="2" opacity="0.75" style="mix-blend-mode:screen">DenisHumen</text>
      <text class="mono"    x="60" y="166" fill="#e9f1f7" font-size="76" font-weight="bold" letter-spacing="2">DenisHumen</text>
      <g class="slice" clip-path="url(#sliceBand)">
        <text class="mono" x="60" y="166" fill="#e9f1f7" font-size="76" font-weight="bold" letter-spacing="2" opacity="0.85">DenisHumen</text>
      </g>
    </g>

    <text class="mono" x="63" y="204" fill="#5b6b7d" font-size="16" letter-spacing="7">NETWORKS &#183; SECURITY &#183; SYSTEMS</text>
  </g>

  <!-- ── hud frame ──────────────────────────────────────────── -->
  <g stroke="#22d3ee" stroke-width="1.6" fill="none" opacity="0.55">
    <path d="M22 22 h34 M22 22 v26"/>
    <path d="M1178 22 h-34 M1178 22 v26"/>
    <path d="M22 278 h34 M22 278 v-26"/>
    <path d="M1178 278 h-34 M1178 278 v-26"/>
  </g>

  <!-- ── status bar ─────────────────────────────────────────── -->
  <line x1="60" y1="238" x2="1140" y2="238" stroke="#1c2733" stroke-width="1"/>
  <g class="mono" font-size="12.5" letter-spacing="2.2" fill="#3d5563">
    <text x="60"  y="262">[ layer:07 ]</text>
    <text x="196" y="262">[ proto: tcp/tls ]</text>
    <text x="382" y="262">[ loc: ua ]</text>
    <text x="500" y="262">[ lang: py &#183; rs &#183; ts &#183; sh ]</text>
    <text x="790" y="262" fill="#22d3ee" class="hum">[ status: focusing ]</text>
  </g>
  <text class="mono" x="1140" y="86" font-size="13" letter-spacing="2.4" fill="#3d5563" text-anchor="end">present day, present time</text>

  <!-- ── crt overlays ───────────────────────────────────────── -->
  <rect class="sweep" x="0" y="0" width="1200" height="70" fill="url(#sweep)"/>
  <rect width="1200" height="300" fill="url(#scan)"/>
  <rect width="1200" height="300" filter="url(#noise)" opacity="0.055" style="mix-blend-mode:screen"/>
  <rect width="1200" height="300" fill="url(#vignette)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" fill="none" stroke="#1b2632" stroke-width="1.5" rx="3"/>
</svg>
