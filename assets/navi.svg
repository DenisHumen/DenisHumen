<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Navi terminal">
  <defs>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#062b33"/>
      <stop offset="100%" stop-color="#03151a"/>
    </linearGradient>
    <radialGradient id="hal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sl" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.5" fill="#000" opacity="0.45"/>
    </pattern>
    <filter id="nz"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="4">
      <animate attributeName="seed" values="1;9;4;13;6" dur="0.7s" repeatCount="indefinite"/>
    </feTurbulence><feColorMatrix type="saturate" values="0"/></filter>
    <clipPath id="cp"><rect x="32" y="42" width="176" height="118" rx="8"/></clipPath>
    <style>
      .mono { font-family: "DejaVu Sans Mono", Consolas, monospace; }
      @keyframes bl { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes sw { 0%{transform:translateY(-30px)} 100%{transform:translateY(150px)} }
      @keyframes rot{ 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
      .cur { animation: bl 1s steps(1,end) infinite; }
      .swp { animation: sw 3.4s linear infinite; }
      .rng { animation: rot 14s linear infinite; transform-origin: 120px 120px; }
    </style>
  </defs>

  <circle cx="120" cy="120" r="118" fill="url(#hal)"/>
  <g class="rng" fill="none" stroke="#22d3ee" opacity="0.35">
    <circle cx="120" cy="120" r="112" stroke-width="1" stroke-dasharray="3 9"/>
    <circle cx="120" cy="120" r="102" stroke-width="0.8" stroke-dasharray="22 60" opacity="0.6"/>
  </g>

  <rect x="24" y="34" width="192" height="134" rx="12" fill="#0b1119" stroke="#1e2a38" stroke-width="2"/>
  <rect x="32" y="42" width="176" height="118" rx="8" fill="url(#scr)"/>

  <g clip-path="url(#cp)">
    <g class="mono" font-size="11" fill="#4be0f5" letter-spacing="1">
      <text x="42" y="62">&gt; navi --boot</text>
      <text x="42" y="80" opacity="0.8">link up ....... ok</text>
      <text x="42" y="98" opacity="0.7">tunnel ........ ok</text>
      <text x="42" y="116" opacity="0.6">layer 07 ...... ok</text>
      <text x="42" y="138" fill="#e9f1f7">&gt; <tspan class="cur">&#9608;</tspan></text>
    </g>
    <rect class="swp" x="32" y="0" width="176" height="30" fill="#7dd3fc" opacity="0.07"/>
    <rect x="32" y="42" width="176" height="118" fill="url(#sl)"/>
    <rect x="32" y="42" width="176" height="118" filter="url(#nz)" opacity="0.07" style="mix-blend-mode:screen"/>
  </g>

  <rect x="98" y="168" width="44" height="14" fill="#0b1119" stroke="#1e2a38" stroke-width="2"/>
  <rect x="70" y="182" width="100" height="9" rx="4" fill="#0b1119" stroke="#1e2a38" stroke-width="2"/>
  <circle cx="200" cy="52" r="3.4" fill="#ff2d55"><animate attributeName="opacity" values="1;0.15;1" dur="2.2s" repeatCount="indefinite"/></circle>
  <text class="mono" x="120" y="212" font-size="10" letter-spacing="4" fill="#1f6b7a" text-anchor="middle">NAVI // ONLINE</text>
</svg>
